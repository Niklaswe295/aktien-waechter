# Aktien-Waechter in der Cloud: laeuft alle 30 Minuten (06-23 Uhr deutscher Zeit).
# Das Skript entscheidet selbst, was gerade dran ist: Schlagzeilen sammeln, Scan ab 17:45,
# Abendbericht ab 19:00. Gesammelte Daten werden danach ins Repository zurueckgeschrieben.
# GitHub startet geplante Laeufe oft 5-30 Minuten verspaetet - der Bericht kommt also gegen 19-19:30 Uhr.
name: Aktien-Waechter

on:
  schedule:
    - cron: '*/30 4-21 * * *'   # UTC
  workflow_dispatch:            # "Run workflow"-Knopf zum Testen
    inputs:
      modus:
        description: 'normal, Ueberblick (Bericht sofort schicken) oder Test (Testnachricht)'
        required: false
        default: 'normal'

permissions:
  contents: write

concurrency:
  group: aktien-waechter
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Berlin
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      MODUS: ${{ github.event.inputs.modus }}
    steps:
      - uses: actions/checkout@v4

      - name: Waechter ausfuehren
        shell: pwsh
        run: |
          switch ($env:MODUS) {
            'Ueberblick' { ./waechter.ps1 -Ueberblick }
            'Test'       { ./waechter.ps1 -Test }
            default      { ./waechter.ps1 }
          }

      - name: Daten speichern
        if: always()
        run: |
          git config user.name "aktien-waechter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "Daten $(date +'%Y-%m-%d %H:%M')" && git push -q)
